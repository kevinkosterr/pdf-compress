<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Compress</title>
  <style>
    :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #6b7280; --accent: #2563eb; --card: #fff; --border: #cbd2dc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --fg: #e8eaf0; --muted: #9aa1ad; --accent: #60a5fa; --card: #1a1d24; --border: #343a46; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 16px; }
    main { width: 100%; max-width: 520px; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    #drop { border: 2px dashed var(--border); border-radius: 14px; background: var(--card); padding: 48px 24px;
            text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
    #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
    #drop p { margin: 0; }
    #drop .hint { color: var(--muted); font-size: .9rem; margin-top: .4rem; }
    .levels { display: flex; gap: 8px; margin: 16px 0; justify-content: center; flex-wrap: wrap; }
    .levels label { border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: .9rem; }
    .levels input { display: none; }
    .levels input:checked + span { color: var(--accent); font-weight: 600; }
    .levels label:has(input:checked) { border-color: var(--accent); }
    #status { min-height: 3em; text-align: center; }
    #status a { color: var(--accent); font-weight: 600; }
    .err { color: #dc2626; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<main>
  <h1>Compress a PDF</h1>
  <div id="drop" tabindex="0">
    <p><strong>Drop a PDF here</strong> or click to choose one</p>
    <p class="hint">The compressed file downloads automatically</p>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div class="levels">
    <label><input type="radio" name="level" value="low"><span>Light</span></label>
    <label><input type="radio" name="level" value="medium" checked><span>Balanced</span></label>
    <label><input type="radio" name="level" value="high"><span>Strong</span></label>
  </div>
  <div id="status"></div>
</main>
<script>
  const drop = document.getElementById('drop');
  const input = document.getElementById('file');
  const status = document.getElementById('status');
  let lastUrl;

  const fmt = n => n < 1024 * 1024 ? (n / 1024).toFixed(0) + ' KB' : (n / 1024 / 1024).toFixed(2) + ' MB';

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') input.click(); });
  input.addEventListener('change', () => input.files[0] && upload(input.files[0]));
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });

  async function upload(file) {
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      status.innerHTML = '<span class="err">Please choose a PDF file.</span>';
      return;
    }
    status.innerHTML = '<span class="spinner"></span>Compressing ' + escapeHtml(file.name) + '…';

    const form = new FormData();
    form.append('file', file);
    form.append('level', document.querySelector('input[name=level]:checked').value);

    try {
      const res = await fetch('/compress', { method: 'POST', body: form });
      if (!res.ok) {
        const msg = (await res.json().catch(() => ({}))).detail || res.statusText;
        throw new Error(msg);
      }
      const blob = await res.blob();
      const orig = +res.headers.get('X-Original-Size') || file.size;
      const name = file.name.replace(/\.pdf$/i, '') + '-compressed.pdf';

      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = lastUrl; a.download = name; a.click();

      const saved = Math.max(0, 100 - (blob.size / orig) * 100).toFixed(0);
      status.innerHTML = `${fmt(orig)} → ${fmt(blob.size)} (${saved}% smaller)<br>` +
        `<a href="${lastUrl}" download="${escapeHtml(name)}">Download again</a>`;
    } catch (err) {
      status.innerHTML = '<span class="err">Error: ' + escapeHtml(err.message) + '</span>';
    } finally {
      input.value = '';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
</script>
</body>
</html>
